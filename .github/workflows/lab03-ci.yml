name: Lab 03 Django CI
on:
  push:
    branches: [lab-03]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      DATABASE_URL: postgresql://tutberry:tutberry@localhost:5432/tutberry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run tests
        run: pytest -q
