name: Mutation analysis

# Mutation analysis is separate from normal CI; push trigger is scoped
# to this workflow so it can run from the lab branch without merging to main.
on:
  push:
    branches: [lab05-quality]
    paths:
      - '.github/workflows/mutation-analysis.yml'
      - 'tests/test_booking_mutation_boundaries.py'
  workflow_dispatch:

jobs:
  domain-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutberry
          POSTGRES_PASSWORD: tutberry
          POSTGRES_DB: tutberry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutberry -d tutberry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: mutation-ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://tutberry:tutberry@localhost:5432/tutberry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and pinned major mutation tool
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "mutmut>=2.4,<3"
      - name: Baseline domain tests
        run: python -m pytest tests/test_booking_domain.py tests/test_booking_mutation_boundaries.py -q -p no:randomly
      - name: Analyze booking domain mutations
        shell: bash
        run: |
          set -o pipefail
          mutmut run --paths-to-mutate tutberry/domain/booking.py --runner "python -m pytest tests/test_booking_domain.py tests/test_booking_mutation_boundaries.py -q -p no:randomly" 2>&1 | tee mutation-run.log
      - name: Export mutation outcomes
        if: always()
        shell: bash
        run: |
          mutmut results > mutation-results.txt 2>&1 || true
          cat mutation-results.txt
          echo '--- Surviving mutant diffs (up to 30) ---' | tee mutation-survivors.txt
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          report = Path("mutation-results.txt").read_text(encoding="utf-8")
          section = re.search(
              r"Survived[^\n]*\n-+\s+tutberry/domain/booking\.py[^\n]*\n([^\n]+)",
              report, flags=re.IGNORECASE,
          )
          if section is None:
              with open("mutation-survivors.txt", "a", encoding="utf-8") as output:
                  output.write("Could not parse survivor IDs; see mutation-results.txt\n")
          else:
              ids = []
              for part in section.group(1).split(","):
                  part = part.strip()
                  if re.fullmatch(r"\d+-\d+", part):
                      lo, hi = map(int, part.split("-"))
                      ids.extend(range(lo, hi + 1))
                  elif part.isdigit():
                      ids.append(int(part))
              with open("mutation-survivors.txt", "a", encoding="utf-8") as output:
                  for number in ids[:30]:
                      mutant = f"tutberry/domain/booking.py:{number}"
                      output.write(f"--- {mutant} ---\n")
                      result = subprocess.run(
                          ["mutmut", "show", mutant], text=True,
                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                          check=False,
                      )
                      output.write(result.stdout + "\n")
          PY
          cat mutation-survivors.txt
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-domain-mutation-results
          path: |
            mutation-run.log
            mutation-results.txt
            mutation-survivors.txt
          if-no-files-found: ignore
