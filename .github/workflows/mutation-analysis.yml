name: Mutation analysis (manual)

# Full mutation analysis is intentionally separate from normal CI:
# every mutant triggers a test run and may take several minutes.
on:
  workflow_dispatch:

jobs:
  domain-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutberry
          POSTGRES_PASSWORD: tutberry
          POSTGRES_DB: tutberry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutberry -d tutberry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: mutation-ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://tutberry:tutberry@localhost:5432/tutberry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and pinned major mutation tool
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "mutmut>=2.4,<3"
      - name: Baseline domain tests
        run: python -m pytest tests/test_booking_domain.py -q -p no:randomly
      - name: Analyze booking domain mutations
        shell: bash
        run: |
          set -o pipefail
          mutmut run --paths-to-mutate tutberry/domain/booking.py --runner "python -m pytest tests/test_booking_domain.py -q -p no:randomly" 2>&1 | tee mutation-run.log
      - name: Export mutation outcomes
        if: always()
        shell: bash
        run: |
          mutmut results > mutation-results.txt 2>&1 || true
          cat mutation-results.txt
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-domain-mutation-results
          path: |
            mutation-run.log
            mutation-results.txt
          if-no-files-found: ignore
